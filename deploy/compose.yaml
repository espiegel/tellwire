# Local demo: browser -> edge (Caddy) -> frontend + gateway -> mock MUD.
# Never contacts the real DuneMUD server.
#
#   docker compose up --build        (from the repository root)
#   open http://localhost:8080
name: tellwire-web

services:
  mockmud:
    build: { context: ../gateway, target: mockmud }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MOCKMUD_LISTEN: ":2323"

  gateway:
    build: { context: ../gateway, target: gateway, args: { VERSION: "${VERSION:-dev}" } }
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: { mockmud: { condition: service_started } }
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_UPSTREAMS: "default=mockmud:2323:plain"
      GATEWAY_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      GATEWAY_TRUSTED_PROXIES: "172.29.0.0/24"
      GATEWAY_LOG_FORMAT: "text"

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      SITE_ADDRESS: ":8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }
      frontend: { condition: service_healthy }

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      # Fixed subnet so GATEWAY_TRUSTED_PROXIES (above) can name the edge proxy. Keep the two in sync.
      config: [{ subnet: 172.29.0.0/24 }]
