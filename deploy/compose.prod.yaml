# Production: https://play.dunemud.net  ->  Caddy (auto TLS) -> frontend + gateway -> dunemud.net:6788 (TLS)
#
#   cp deploy/.env.example deploy/.env      # then edit
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --build
name: tellwire-web-prod

services:
  gateway:
    build: { context: ../gateway, target: gateway, args: { VERSION: "${VERSION:-dev}" } }
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 512
    environment:
      GATEWAY_LISTEN: ":8080"
      GATEWAY_UPSTREAMS: "${GATEWAY_UPSTREAMS:-default=dunemud.net:6788:tls}"
      GATEWAY_ALLOWED_ORIGINS: "${GATEWAY_ALLOWED_ORIGINS:?set GATEWAY_ALLOWED_ORIGINS, e.g. https://play.dunemud.net}"
      GATEWAY_TRUSTED_PROXIES: "172.29.0.0/24"
      GATEWAY_MAX_CONNECTIONS: "${GATEWAY_MAX_CONNECTIONS:-500}"
      GATEWAY_MAX_CONNECTIONS_PER_IP: "${GATEWAY_MAX_CONNECTIONS_PER_IP:-10}"
      GATEWAY_LOG_LEVEL: "${GATEWAY_LOG_LEVEL:-info}"
      GATEWAY_LOG_FORMAT: "json"
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    stop_grace_period: 20s

  frontend:
    build: { context: ../frontend }
    restart: always
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    # Optional: rebrand the client for your MUD without rebuilding (see docs/deployment.md, "Branding").
    # volumes:
    #   - ./brand.dunemud.json:/srv/brand.json:ro

  edge:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?set SITE_ADDRESS, e.g. play.dunemud.net}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates: keep this volume!
      - caddy_config:/config
    depends_on:
      gateway: { condition: service_healthy }
      frontend: { condition: service_healthy }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      # Fixed subnet so GATEWAY_TRUSTED_PROXIES (above) can name the edge proxy. Keep the two in sync.
      config: [{ subnet: 172.29.0.0/24 }]
